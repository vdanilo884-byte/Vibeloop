<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VibeLoop — vídeos, música e descobertas</title>
<style>
:root{--bg:#f5f6fa;--panel:#fff;--text:#191923;--muted:#77798a;--line:#e7e8ee;--accent:#ff365d;--accent2:#7048ff;--soft:#fff0f3;--shadow:0 12px 35px #15152a12;--nav:#fff}
[data-theme="dark"]{--bg:#101116;--panel:#191a22;--text:#f4f4f8;--muted:#a0a1b0;--line:#2d2e39;--accent:#ff4970;--accent2:#9a7cff;--soft:#3a202a;--shadow:0 12px 35px #0005;--nav:#171820}
[data-theme="ocean"]{--bg:#eaf5fb;--panel:#fff;--text:#112b3b;--muted:#55717e;--line:#d3e6ef;--accent:#008bb4;--accent2:#4c64d9;--soft:#e3f6fa;--shadow:0 12px 35px #12394d12;--nav:#fff}
[data-theme="sunset"]{--bg:#fff4ed;--panel:#fff;--text:#34221e;--muted:#806b63;--line:#f0ddd3;--accent:#ec5b3e;--accent2:#b14ea2;--soft:#fff0e9;--shadow:0 12px 35px #53221412;--nav:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;transition:.2s}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}a{color:var(--accent);word-break:break-word}.app{min-height:100vh}.top{height:72px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1380px)/2));position:sticky;top:0;z-index:5}.brand{font-size:23px;font-weight:900;letter-spacing:-1px;display:flex;align-items:center;gap:9px}.brand-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:white}.top-right{display:flex;align-items:center;gap:12px}.coin-pill,.user-pill{border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:var(--panel);font-weight:700}.coin-pill{color:#cc8d05}.user-pill{display:flex;align-items:center;gap:8px}.avatar{height:30px;width:30px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#ff7191,#775aff);display:inline-grid;place-items:center;color:white;font-weight:800}.layout{max-width:1380px;margin:auto;display:grid;grid-template-columns:220px minmax(360px,1fr) 290px;gap:24px;padding:24px}.sidebar{position:sticky;top:96px;align-self:start;display:flex;flex-direction:column;gap:7px}.navbtn{border:0;background:transparent;text-align:left;padding:13px 14px;border-radius:13px;font-weight:700;color:var(--muted);display:flex;gap:12px;align-items:center}.navbtn:hover,.navbtn.active{background:var(--soft);color:var(--accent)}.navbtn .ico{width:22px;text-align:center;font-size:18px}.side-note{margin-top:20px;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12px}.content{min-width:0}.rightcol{display:flex;flex-direction:column;gap:16px}.panel,.section-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.panel{padding:17px}.section-card{padding:22px;margin-bottom:16px}.feed-tabs{display:flex;align-items:center;gap:21px;border-bottom:1px solid var(--line);margin:-2px 0 16px}.feed-tab{border:0;background:none;padding:10px 2px;color:var(--muted);font-weight:800;border-bottom:2px solid transparent}.feed-tab.active{color:var(--text);border-color:var(--accent)}.story-row{display:flex;gap:15px;overflow:auto;margin-bottom:17px}.story{flex:0 0 67px;text-align:center;font-size:11px;color:var(--muted)}.story-ring{width:58px;height:58px;padding:3px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));margin:0 auto 5px}.story-ring div{width:100%;height:100%;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:21px}.video-card{margin-bottom:18px;overflow:hidden}.post-head{display:flex;align-items:center;gap:10px;padding:14px 16px}.post-meta{flex:1}.post-meta strong{display:block}.post-meta small{color:var(--muted)}.more{border:0;background:transparent;font-size:20px}.video-stage{height:440px;background:linear-gradient(145deg,#242039,#171825 50%,#42304b);position:relative;display:grid;place-items:center;overflow:hidden;color:white}.video-stage img,.video-stage video{height:100%;width:100%;object-fit:cover}.video-placeholder{text-align:center;max-width:350px;padding:30px}.play-button{height:70px;width:70px;border:1px solid #ffffff6b;border-radius:50%;background:#ffffff22;color:#fff;font-size:26px;margin-bottom:14px;backdrop-filter:blur(5px)}.video-caption{position:absolute;bottom:0;left:0;right:0;padding:55px 18px 17px;background:linear-gradient(transparent,#000b);color:#fff}.video-caption p{margin:4px 0}.original-link{display:inline-block;margin-top:6px;color:#fff;font-size:12px}.post-actions{display:flex;gap:15px;padding:12px 16px;align-items:center}.action{background:none;border:0;color:var(--muted);font-weight:700}.action:hover{color:var(--accent)}.action.liked{color:var(--accent)}.action-row{display:flex;align-items:center;gap:9px}.inline-form{display:flex;gap:8px;padding:0 16px 14px}.field,.select,.textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);outline:none}.field:focus,.textarea:focus,.select:focus{border-color:var(--accent)}.textarea{min-height:90px;resize:vertical}.btn{border:0;border-radius:11px;padding:10px 15px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;font-weight:800}.btn.secondary{background:var(--soft);color:var(--accent)}.btn.outline{background:transparent;border:1px solid var(--line);color:var(--text)}.btn.small{padding:8px 11px;font-size:13px}.tag{display:inline-flex;padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:11px;font-weight:800}.muted{color:var(--muted)}h1,h2,h3,p{margin-top:0}h1{font-size:25px;letter-spacing:-.5px;margin-bottom:5px}h2{font-size:19px;margin-bottom:6px}.section-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formrow{margin-bottom:14px}.formrow label{display:block;font-weight:700;font-size:13px;margin:0 0 6px}.form-actions{display:flex;gap:9px;flex-wrap:wrap}.notice{padding:12px 14px;background:var(--soft);border-radius:12px;color:var(--muted);font-size:12px;margin:14px 0}.product-card{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;margin:10px 0;align-items:center}.product-icon{height:52px;width:52px;display:grid;place-items:center;background:var(--soft);border-radius:13px;font-size:23px}.product-info{flex:1;min-width:0}.product-info strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.product-info small{color:var(--muted)}.profile-cover{height:150px;border-radius:15px;background:linear-gradient(120deg,#ff7891,#755aff);background-size:cover;background-position:center}.profile-head{display:flex;align-items:end;gap:14px;margin:-35px 0 18px 18px}.profile-head .avatar{width:84px;height:84px;border:4px solid var(--panel);font-size:26px}.profile-stat{display:flex;gap:20px;color:var(--muted);font-size:13px}.profile-stat b{color:var(--text)}.profile-links{margin-top:9px}.music-card{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:14px;padding:14px;margin:10px 0}.music-disc{height:47px;width:47px;border-radius:50%;background:linear-gradient(130deg,#20d880,#111);display:grid;place-items:center;color:white;font-size:20px}.music-card div:nth-child(2){flex:1}.wallet-total{font-size:36px;font-weight:900;color:#d49500}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--line)}.toggle{appearance:none;width:46px;height:26px;border-radius:99px;background:#bbb;position:relative;cursor:pointer;transition:.2s}.toggle:checked{background:var(--accent)}.toggle:before{content:"";width:20px;height:20px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:.2s}.toggle:checked:before{left:23px}.theme-options{display:flex;gap:9px;flex-wrap:wrap}.theme-swatch{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:9px 12px}.theme-swatch.active{border-color:var(--accent);color:var(--accent)}.empty{text-align:center;padding:45px 20px;color:var(--muted)}.modal-backdrop{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:10;padding:18px}.modal-backdrop.show{display:flex}.modal{background:var(--panel);border:1px solid var(--line);width:min(460px,100%);border-radius:20px;padding:22px;box-shadow:0 25px 90px #0004}.modal-head{display:flex;align-items:center;justify-content:space-between}.close{border:0;background:none;font-size:24px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,15px);opacity:0;background:#20212b;color:white;border-radius:12px;padding:11px 16px;z-index:20;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.right-stat{display:flex;justify-content:space-between;padding:8px 0;color:var(--muted)}.right-stat b{color:var(--text)}.small-text{font-size:12px;color:var(--muted)}.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.seller-badge{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);font-weight:900}.platforms{display:flex;gap:7px;flex-wrap:wrap}.platforms .tag{background:var(--bg);color:var(--muted)}.bottom-nav{display:none}
@media(max-width:1100px){.layout{grid-template-columns:190px minmax(350px,1fr);}.rightcol{display:none}}
@media(max-width:720px){.top{height:60px;padding:0 14px}.brand{font-size:20px}.top-right .user-pill span{display:none}.layout{display:block;padding:14px 12px 80px}.sidebar{display:none}.rightcol{display:none}.content{max-width:600px;margin:auto}.video-stage{height:min(68vh,510px)}.section-card{padding:17px}.grid2{grid-template-columns:1fr}.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:var(--nav);border-top:1px solid var(--line);padding:7px 3px calc(7px + env(safe-area-inset-bottom));z-index:6}.bottom-nav button{border:0;background:none;color:var(--muted);font-size:10px;display:grid;gap:3px;justify-items:center}.bottom-nav button span{font-size:19px}.shop-grid{grid-template-columns:1fr}}
</style></head>
<body><div class="app" id="app">
<header class="top"><div class="brand"><span class="brand-mark">▶</span> VibeLoop</div><div class="top-right"><button class="coin-pill" onclick="showPage('wallet')">🪙 <span id="coinsTop">500</span></button><button class="user-pill" onclick="showPage('profile')"><span class="avatar" id="topAvatar">D</span><span id="topName">Danilo</span></button></div></header>
<div class="layout"><aside class="sidebar" id="sidebar"></aside><main class="content" id="main"></main><aside class="rightcol" id="rightcol"></aside></div><nav class="bottom-nav" id="bottomNav"></nav></div>
<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const KEY='vibeloop_demo_v1';
const defaultState={name:'Danilo',username:'danilo',bio:'Criando e descobrindo coisas novas ✨',profilePhoto:'',coverPhoto:'',profileLink:'',theme:'light',adult:false,seller:true,coins:500,dailyClaimed:'',posts:[{id:'welcome',user:'VibeLoop',handle:'vibeloop',caption:'Seu espaço para vídeos, música e descobertas. Publique um link para começar!',url:'',music:'',platform:'',product:'',productDesc:'',likes:12,reposts:2,comments:[],liked:false}],products:[],musicItems:[],followers:0};
let state;try{state={...defaultState,...JSON.parse(localStorage.getItem(KEY)||'{}')};}catch(e){state={...defaultState}}
let currentPage='feed',feedMode='Para você';
const navItems=[['feed','⌂','Início'],['publish','＋','Publicar'],['music','♫','Músicas'],['shop','▣','Vitrine'],['profile','◉','Meu perfil'],['wallet','🪙','Moedas'],['settings','⚙','Configurações']];
function save(){localStorage.setItem(KEY,JSON.stringify(state));updateTop()}
function updateTop(){document.getElementById('coinsTop').textContent=state.coins;document.getElementById('topName').textContent=state.name||'Perfil';let a=document.getElementById('topAvatar');if(state.profilePhoto){a.innerHTML='';a.style.backgroundImage=`url('${state.profilePhoto}')`;a.style.backgroundSize='cover'}else{a.textContent=(state.name||'D')[0].toUpperCase();a.style.backgroundImage=''}document.body.dataset.theme=state.theme==='light'?'':state.theme}
function init(){updateTop();renderNav();renderPage();renderRight()}
function renderNav(){let visible=navItems.filter(([id])=>id!=='shop'||state.seller);let html=visible.map(([id,ico,label])=>`<button class="navbtn ${currentPage===id?'active':''}" onclick="showPage('${id}')"><span class="ico">${ico}</span>${label}</button>`).join('')+`<div class="side-note"><b>Protótipo demonstrativo</b><br>Os dados ficam salvos neste navegador. Recursos de servidor e integrações reais precisam ser conectados.</div>`;document.getElementById('sidebar').innerHTML=html;document.getElementById('bottomNav').innerHTML=visible.filter(([id])=>['feed','publish','music','shop','profile'].includes(id)).slice(0,5).map(([id,ico,label])=>`<button onclick="showPage('${id}')"><span>${ico}</span>${label}</button>`).join('')}
function showPage(page){currentPage=page;renderNav();renderPage();window.scrollTo({top:0,behavior:'smooth'})}
function renderRight(){document.getElementById('rightcol').innerHTML=`<div class="panel"><h2>Seu resumo</h2><div class="right-stat"><span>Moedas</span><b>🪙 ${state.coins}</b></div><div class="right-stat"><span>Vídeos publicados</span><b>${state.posts.filter(p=>p.user!=='VibeLoop').length}</b></div><div class="right-stat"><span>Produtos na vitrine</span><b>${state.products.length}</b></div><button class="btn secondary" style="width:100%;margin-top:10px" onclick="showPage('wallet')">Ver carteira</button></div><div class="panel"><h2>✨ Dica rápida</h2><p class="small-text">Cole o link de um vídeo ou selecione um arquivo local na área Publicar. O link original fica disponível para abrir.</p><button class="btn small" onclick="showPage('publish')">Criar publicação</button></div><div class="panel"><b>Segurança em primeiro lugar</b><p class="small-text" style="margin:8px 0 0">A moderação exibida neste protótipo é ilustrativa e não substitui análise real.</p></div>`}
function renderPage(){const m=document.getElementById('main');if(currentPage==='feed')m.innerHTML=feedHTML();else if(currentPage==='publish')m.innerHTML=publishHTML();else if(currentPage==='profile')m.innerHTML=profileHTML();else if(currentPage==='shop')m.innerHTML=shopHTML();else if(currentPage==='music')m.innerHTML=musicHTML();else if(currentPage==='wallet')m.innerHTML=walletHTML();else m.innerHTML=settingsHTML();}
function safe(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function feedHTML(){let posts=[...state.posts].reverse();return `<div class="story-row"><div class="story"><div class="story-ring"><div>＋</div></div>Seu story</div><div class="story"><div class="story-ring"><div>🎵</div></div>Músicas</div><div class="story"><div class="story-ring"><div>🛍️</div></div>Achados</div><div class="story"><div class="story-ring"><div>✨</div></div>Novidades</div></div><div class="feed-tabs">${['Para você','Seguindo'].map(x=>`<button class="feed-tab ${feedMode===x?'active':''}" onclick="feedMode='${x}';renderPage()">${x}</button>`).join('')}<button class="btn small" style="margin-left:auto;margin-bottom:6px" onclick="showPage('publish')">＋ Publicar</button></div>${posts.map(postHTML).join('')}`}
function embedUrl(link){try{const u=new URL(link);if(u.hostname.includes('youtu.be'))return 'https://www.youtube-nocookie.com/embed/'+u.pathname.slice(1).split('/')[0];if(u.hostname.includes('youtube.com')){let id=u.searchParams.get('v');if(!id&&u.pathname.includes('/shorts/'))id=u.pathname.split('/shorts/')[1].split('/')[0];if(id)return 'https://www.youtube-nocookie.com/embed/'+id}if(u.hostname.includes('tiktok.com')){let id=u.pathname.match(/\/video\/(\d+)/)?.[1];if(id)return 'https://www.tiktok.com/player/v1/'+id+'?autoplay=0'}if(u.hostname.includes('vimeo.com')){let id=u.pathname.split('/').filter(Boolean).pop();if(/^\d+$/.test(id))return 'https://player.vimeo.com/video/'+id}}catch(e){}return ''}
function postHTML(p){let media='';if(p.localVideo){media=`<video src="${p.localVideo}" controls playsinline style="width:100%;height:100%;object-fit:cover"></video>`}else if(p.url){let embed=embedUrl(p.url);media=embed?`<iframe src="${safe(embed)}" title="Vídeo incorporado" style="border:0;width:100%;height:100%" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>`:`<div class="video-placeholder"><button class="play-button" onclick="window.open('${safe(p.url)}','_blank','noopener')">▶</button><div>Prévia indisponível aqui</div><a class="original-link" href="${safe(p.url)}" target="_blank" rel="noopener">Abrir vídeo original ↗</a></div>`}else{media=`<div class="video-placeholder"><button class="play-button" onclick="showPage('publish')">▶</button><div><b>Seu próximo vídeo começa aqui</b><br><span style="opacity:.75">Cole um link na área Publicar</span></div></div>`}let isOwner=p.user===state.name;return `<article class="panel video-card"><div class="post-head"><span class="avatar">${safe((p.user||'V')[0].toUpperCase())}</span><div class="post-meta"><strong>${safe(p.user)} <span class="muted">@${safe(p.handle||'usuario')}</span></strong><small>${safe(p.platform||'Vídeo')} · agora</small></div><button class="more" onclick="toast('Opções de publicação')">···</button></div><div class="video-stage">${media}<div class="video-caption"><b>${safe(p.user)}</b><p>${safe(p.caption||'')}</p>${p.url?`<a class="original-link" href="${safe(p.url)}" target="_blank" rel="noopener">Ver vídeo original ↗</a>`:''}${p.music?`<div style="font-size:12px;margin-top:5px">♫ ${safe(p.music)}</div>`:''}${p.product?`<a class="original-link" href="${safe(p.product)}" target="_blank" rel="noopener">🛍️ ${safe(p.productDesc||'Ver produto')}</a>`:''}</div></div><div class="post-actions"><button class="action ${p.liked?'liked':''}" onclick="likePost('${p.id}')">${p.liked?'♥':'♡'} ${p.likes||0}</button><button class="action" onclick="toggleComments('${p.id}')">▢ ${p.comments?.length||0}</button><button class="action" onclick="repost('${p.id}')">⟳ ${p.reposts||0} reposts</button><button class="action" onclick="sharePost('${p.id}')">↗ Compartilhar</button>${isOwner?'<span class="tag" style="margin-left:auto">Sua publicação</span>':''}</div><div id="comments-${p.id}" style="display:none;padding:0 16px 14px"><div class="small-text" style="margin-bottom:8px">${(p.comments||[]).map(c=>`<p style="margin:4px 0"><b>${safe(c.user)}:</b> ${safe(c.text)}</p>`).join('')||'Ainda sem comentários.'}</div><div class="inline-form" style="padding:0"><input class="field" id="comment-${p.id}" placeholder="Escreva um comentário"><button class="btn small" onclick="addComment('${p.id}')">Enviar</button></div></div></article>`}
function publishHTML(){return `<section class="section-card"><div class="section-head"><div><h1>Criar publicação</h1><p class="muted">Adicione um vídeo por link ou escolha um arquivo do aparelho.</p></div><span class="tag">Criador</span></div><div class="notice">Ao colar um link, o vídeo será incorporado quando a plataforma permitir. O link original continuará clicável. Este HTML não faz upload para redes externas.</div><div class="formrow"><label>Link do vídeo</label><input id="postUrl" class="field" type="url" placeholder="https://..." oninput="previewPost()"></div><div class="formrow"><label>Ou selecione um vídeo local</label><input id="videoFile" class="field" type="file" accept="video/*"></div><div class="formrow"><label>Descrição</label><textarea id="postCaption" class="textarea" placeholder="Conte para a comunidade..."></textarea></div><div class="grid2"><div class="formrow"><label>Música / link de áudio</label><input id="postMusic" class="field" placeholder="Nome da música ou link do Spotify"></div><div class="formrow"><label>Link de produto (opcional)</label><input id="postProduct" class="field" type="url" placeholder="Link da Shopee, Mercado Livre, Shein..."></div></div><div class="formrow"><label>Descrição do produto (opcional)</label><input id="postProductDesc" class="field" placeholder="Nome, preço ou informação"></div><div id="postPreview" class="notice" style="display:none"></div><div class="form-actions"><button class="btn" onclick="createPost()">Publicar no VibeLoop</button><button class="btn secondary" onclick="runModeration()">Verificar conteúdo</button></div><div class="notice"><b>Moderação:</b> a checagem nesta demonstração examina apenas o texto digitado; não analisa imagem, áudio ou vídeo de verdade. Serviço de IA, denúncias, revisão e remoção automática exigem backend.</div></section>`}
function profileHTML(){return `<section class="section-card"><div class="section-head"><div><h1>Meu perfil</h1><p class="muted">Personalize sua página pública.</p></div><button class="btn secondary" onclick="showPage('settings')">Editar perfil</button></div><div class="profile-cover" style="${state.coverPhoto?`background-image:url('${state.coverPhoto}')`:''}"></div><div class="profile-head"><span class="avatar" style="${state.profilePhoto?`background-image:url('${state.profilePhoto}');background-size:cover`:''}">${state.profilePhoto?'':safe((state.name||'D')[0].toUpperCase())}</span><div><h2 style="margin:0">${safe(state.name)} <span class="muted" style="font-size:14px">@${safe(state.username)}</span></h2><div class="profile-stat"><span><b>${state.posts.filter(p=>p.user===state.name).length}</b> publicações</span><span><b>${state.followers}</b> seguidores</span><span><b>${state.posts.reduce((a,p)=>a+(p.likes||0),0)}</b> curtidas</span></div></div></div><p>${safe(state.bio||'')}</p>${state.profileLink?`<div class="profile-links"><a href="${safe(state.profileLink)}" target="_blank" rel="noopener">${safe(state.profileLink)} ↗</a></div>`:''}<div style="border-top:1px solid var(--line);margin-top:19px;padding-top:18px"><h2>Publicações</h2>${state.posts.filter(p=>p.user===state.name).length?state.posts.filter(p=>p.user===state.name).slice().reverse().map(postHTML).join(''):'<div class="empty">Suas publicações aparecerão aqui.</div>'}</div></section>`}
function shopHTML(){return `<section class="section-card"><div class="section-head"><div><h1>Vitrine de produtos</h1><p class="muted">Compartilhe produtos por link de afiliado ou loja.</p></div><button class="btn" onclick="openProductModal()">＋ Adicionar produto</button></div><div class="notice">Plataformas aceitas: Shopee, Mercado Livre, Shein, AliExpress, Alibaba, Temu e outros links. Compra e comissões são processadas pelo site de destino, não por este protótipo.</div><div class="shop-grid">${state.products.length?state.products.map((p,i)=>`<div class="product-card"><div class="product-icon">🛍️</div><div class="product-info"><span class="seller-badge">${safe(p.platform||'Loja')}</span><strong>${safe(p.name||'Produto')}</strong><small>${safe(p.desc||'')}</small><div><a href="${safe(p.url)}" target="_blank" rel="noopener">Abrir produto ↗</a></div></div></div>`).join(''):'<div class="empty" style="grid-column:1/-1">Sua vitrine está vazia. Adicione um link de produto.</div>'}</div></section><section class="section-card"><h2>Publicações com produtos</h2>${state.posts.filter(p=>p.product).length?state.posts.filter(p=>p.product).slice().reverse().map(postHTML).join(''):'<p class="muted">Produtos vinculados a vídeos aparecerão aqui.</p>'}</section>`}
function musicHTML(){return `<section class="section-card"><div class="section-head"><div><h1>Biblioteca de músicas</h1><p class="muted">Guarde faixas e links de áudio para usar nos seus vídeos.</p></div><button class="btn" onclick="openMusicModal()">＋ Adicionar música</button></div><div class="notice">Spotify e outros serviços podem abrir players ou links externos conforme as regras de cada plataforma. Licenças musicais e reprodução no feed precisam de integração própria.</div>${state.musicItems.length?state.musicItems.map(m=>`<div class="music-card"><div class="music-disc">♫</div><div><b>${safe(m.name)}</b><div class="small-text">${safe(m.artist||'')}</div></div><span class="tag">${safe(m.platform||'Áudio')}</span><a class="btn small secondary" href="${safe(m.url)}" target="_blank" rel="noopener">Abrir ↗</a></div>`).join(''):'<div class="empty">Nenhuma música salva ainda.</div>'}</section>`}
function walletHTML(){let claimed=state.dailyClaimed===new Date().toDateString();return `<section class="section-card"><div class="section-head"><div><h1>Carteira de moedas</h1><p class="muted">Moedas demonstrativas — sem valor monetário real.</p></div><span class="tag">FastCheck · demo</span></div><div class="panel" style="text-align:center;padding:26px"><div class="wallet-total">🪙 ${state.coins}</div><p class="muted">saldo disponível</p><button class="btn" ${claimed?'disabled':''} onclick="claimDaily()">${claimed?'Bônus diário já resgatado':'Resgatar 500 moedas diárias'}</button></div><div class="grid2" style="margin-top:16px"><div class="panel"><h2>Impulsionamento</h2><p class="muted">500 moedas = 30 minutos de destaque (simulação).</p><button class="btn secondary" onclick="boostPost()">Impulsionar publicação</button></div><div class="panel"><h2>Indique alguém</h2><p class="muted">Convide um amigo. A recompensa real de 1.000 moedas exigiria login, atribuição e prevenção de fraude no servidor.</p><button class="btn secondary" onclick="copyReferral()">Copiar link de convite</button></div></div><div class="notice"><b>Como está no protótipo:</b> você começa com saldo de demonstração. Likes, comentários e reposts não liberam créditos reais, pois isso poderia ser explorado sem validação antifraude.</div></section>`}
function settingsHTML(){return `<section class="section-card"><div class="section-head"><div><h1>Configurações</h1><p class="muted">Conta, aparência e segurança.</p></div></div><div class="grid2"><div class="formrow"><label>Nome</label><input id="settingName" class="field" value="${safe(state.name)}"></div><div class="formrow"><label>Nome de usuário</label><input id="settingUsername" class="field" value="${safe(state.username)}"></div></div><div class="formrow"><label>Bio</label><textarea id="settingBio" class="textarea">${safe(state.bio)}</textarea></div><div class="formrow"><label>Link do perfil</label><input id="settingLink" class="field" type="url" value="${safe(state.profileLink)}" placeholder="https://..."></div><div class="grid2"><div class="formrow"><label>Foto de perfil</label><input id="profileFile" class="field" type="file" accept="image/*"></div><div class="formrow"><label>Imagem de capa</label><input id="coverFile" class="field" type="file" accept="image/*"></div></div><div class="form-actions"><button class="btn" onclick="saveProfile()">Salvar perfil</button></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h2>Aparência</h2><p class="muted">Escolha um tema para o aplicativo.</p><div class="theme-options">${[['light','☀️ Claro'],['dark','🌙 Escuro'],['ocean','🌊 Oceano'],['sunset','🌅 Pôr do sol']].map(([id,label])=>`<button class="theme-swatch ${state.theme===id?'active':''}" onclick="setTheme('${id}')">${label}</button>`).join('')}</div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h2>Recursos</h2><div class="setting-row"><div><b>Vendedor / produtos</b><div class="small-text">Mostrar ferramentas de vitrine e links de produtos.</div></div><input class="toggle" type="checkbox" ${state.seller?'checked':''} onchange="state.seller=this.checked;save();toast('Preferência salva')"></div><div class="setting-row"><div><b>Conteúdo com restrição 18+</b><div class="small-text">Ativar apenas após confirmar maioridade. Não libera conteúdo automaticamente.</div></div><input class="toggle" type="checkbox" ${state.adult?'checked':''} onchange="toggleAdult(this)"></div><div class="notice"><b>Verificação etária e segurança:</b> esta opção é apenas uma preferência local. Um serviço real precisa validar idade, bloquear menores, moderar conteúdo e oferecer denúncia/revisão. Não publique conteúdo ilegal ou envolvendo menores.</div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h2>Conta e acesso</h2><p class="muted">Login/senha e sincronização entre aparelhos não são implementados nesta página isolada.</p><button class="btn secondary" onclick="loginModal()">Entrar / criar conta (demonstração)</button></section>`}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
function likePost(id){let p=state.posts.find(x=>x.id===id);if(!p)return;p.liked=!p.liked;p.likes=(p.likes||0)+(p.liked?1:-1);save();renderPage();renderRight()}
function repost(id){let p=state.posts.find(x=>x.id===id);if(p){p.reposts=(p.reposts||0)+1;save();renderPage();toast('Repost registrado nesta demonstração')}}
function toggleComments(id){let e=document.getElementById('comments-'+id);if(e)e.style.display=e.style.display==='none'?'block':'none'}
function addComment(id){let input=document.getElementById('comment-'+id);if(!input?.value.trim())return;let p=state.posts.find(x=>x.id===id);p.comments=p.comments||[];p.comments.push({user:state.name,text:input.value.trim()});save();renderPage();document.getElementById('comments-'+id).style.display='block'}
async function sharePost(id){let p=state.posts.find(x=>x.id===id);let text=p?.url||location.href;if(navigator.share){try{await navigator.share({title:'VibeLoop',text:p?.caption||'Veja este vídeo',url:text})}catch(e){}}else{navigator.clipboard?.writeText(text);toast('Link copiado (ou selecione para copiar)')}}
function previewPost(){let val=document.getElementById('postUrl').value.trim(),box=document.getElementById('postPreview');if(val){box.style.display='block';box.innerHTML=`Link recebido: <a href="${safe(val)}" target="_blank" rel="noopener">${safe(val)}</a>. Clique em Publicar para adicionar ao feed.`}else box.style.display='none'}
function analyzeText(text){let rules=[['Segurança de menores',/pedofil|explora[cç][aã]o infantil|abuso infantil/i],['Violência / ameaça',/vou matar|amea[cç]a|agress[aã]o|massacre/i],['Discurso de ódio',/homofob|misogin|racis|nazist|matar (?:os|as) (?:gays|mulheres|negros)/i],['Possível desinformação',/cura garantida|not[ií]cia falsa|fake news/i],['Conteúdo adulto',/porn[oô]|sexo expl[ií]cito/i]];return rules.filter(x=>x[1].test(text)).map(x=>x[0])}
function runModeration(){let text=[document.getElementById('postCaption')?.value,document.getElementById('postProductDesc')?.value].filter(Boolean).join(' '),hits=analyzeText(text);if(hits.length){toast('Revisão necessária: '+hits.join(', '));alert('DEMONSTRAÇÃO: foram encontrados termos que podem exigir revisão: '+hits.join(', ')+'. Não foi analisado nenhum vídeo/imagem/áudio.');}else{toast('Nenhum termo de risco foi detectado no texto.');alert('DEMONSTRAÇÃO: nenhum termo sinalizado no texto informado. Isso não comprova que o conteúdo é seguro.');}}
function createPost(){let url=document.getElementById('postUrl').value.trim(),caption=document.getElementById('postCaption').value.trim(),music=document.getElementById('postMusic').value.trim(),product=document.getElementById('postProduct').value.trim(),productDesc=document.getElementById('postProductDesc').value.trim(),file=document.getElementById('videoFile').files[0];if(!url&&!file){toast('Cole um link ou escolha um vídeo');return}if(url&&!/^https?:\/\//i.test(url)){toast('Use um link começando com http:// ou https://');return}let flags=analyzeText(caption+' '+productDesc);if(flags.length){alert('A publicação ficou retida na demonstração para revisão: '+flags.join(', '));return}let p={id:'p'+Date.now(),user:state.name,handle:state.username,caption,url,music,product,productDesc,platform:'Vídeo',likes:0,reposts:0,comments:[],liked:false};if(file){p.localVideo=URL.createObjectURL(file);p.platform='Arquivo local (temporário)'}state.posts.push(p);if(product){state.products.push({name:productDesc||'Produto do vídeo',desc:caption,url:product,platform:guessPlatform(product)})}save();toast('Publicação adicionada ao feed');showPage('feed')}
function guessPlatform(url){let s=url.toLowerCase();return s.includes('shopee')?'Shopee':s.includes('mercadolivre')?'Mercado Livre':s.includes('shein')?'Shein':s.includes('aliexpress')?'AliExpress':s.includes('alibaba')?'Alibaba':s.includes('temu')?'Temu':'Link externo'}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBackdrop').classList.add('show')};function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
function openProductModal(){openModal(`<div class="modal-head"><h2>Adicionar produto</h2><button class="close" onclick="closeModal()">×</button></div><div class="formrow"><label>Nome do produto</label><input class="field" id="prodName" placeholder="Ex.: fone bluetooth"></div><div class="formrow"><label>Loja / plataforma</label><select class="select" id="prodPlatform"><option>Shopee</option><option>Mercado Livre</option><option>Shein</option><option>AliExpress</option><option>Alibaba</option><option>Temu</option><option>Outra</option></select></div><div class="formrow"><label>Descrição</label><input class="field" id="prodDesc" placeholder="Detalhes, preço ou observação"></div><div class="formrow"><label>Link do produto</label><input class="field" id="prodUrl" type="url" placeholder="https://..."></div><button class="btn" onclick="addProduct()">Salvar produto</button>`)}
function addProduct(){let name=document.getElementById('prodName').value.trim(),platform=document.getElementById('prodPlatform').value,desc=document.getElementById('prodDesc').value.trim(),url=document.getElementById('prodUrl').value.trim();if(!url||!/^https?:\/\//i.test(url)){toast('Informe um link válido');return}state.products.push({name:name||'Produto',platform,desc,url});save();closeModal();renderPage();toast('Produto adicionado à vitrine')}
function openMusicModal(){openModal(`<div class="modal-head"><h2>Adicionar música</h2><button class="close" onclick="closeModal()">×</button></div><div class="formrow"><label>Nome da faixa</label><input class="field" id="musicName" placeholder="Nome da música"></div><div class="formrow"><label>Artista</label><input class="field" id="musicArtist" placeholder="Artista"></div><div class="formrow"><label>Serviço</label><select class="select" id="musicPlatform"><option>Spotify</option><option>YouTube Music</option><option>SoundCloud</option><option>Outro</option></select></div><div class="formrow"><label>Link</label><input class="field" id="musicUrl" type="url" placeholder="https://..."></div><button class="btn" onclick="addMusic()">Salvar faixa</button>`)}
function addMusic(){let name=document.getElementById('musicName').value.trim(),artist=document.getElementById('musicArtist').value.trim(),platform=document.getElementById('musicPlatform').value,url=document.getElementById('musicUrl').value.trim();if(!name||!url||!/^https?:\/\//i.test(url)){toast('Preencha nome e link válido');return}state.musicItems.push({name,artist,platform,url});save();closeModal();renderPage();toast('Música adicionada')}
function readImage(input,key){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{state[key]=r.result;save();toast('Imagem atualizada')};r.readAsDataURL(f)}
function saveProfile(){state.name=document.getElementById('settingName').value.trim()||'Usuário';state.username=document.getElementById('settingUsername').value.trim().replace(/^@/,'')||'usuario';state.bio=document.getElementById('settingBio').value.trim();state.profileLink=document.getElementById('settingLink').value.trim();let pf=document.getElementById('profileFile'),cf=document.getElementById('coverFile');let pending=0;const done=()=>{pending--;if(!pending){save();renderPage();toast('Perfil salvo')}};for(let [input,key] of [[pf,'profilePhoto'],[cf,'coverPhoto']])if(input.files[0]){pending++;let r=new FileReader();r.onload=()=>{state[key]=r.result;done()};r.readAsDataURL(input.files[0])}if(!pending){save();renderPage();toast('Perfil salvo')}}
function setTheme(theme){state.theme=theme;save();renderPage();toast('Tema atualizado')}
function toggleAdult(el){if(el.checked){let ok=confirm('Você confirma que tem 18 anos ou mais? A ativação não valida sua idade nem libera conteúdo automaticamente.');if(!ok){el.checked=false;return}state.adult=true}else state.adult=false;save();toast(state.adult?'Preferência 18+ ativada':'Preferência 18+ desativada')}
function claimDaily(){if(state.dailyClaimed===new Date().toDateString()){toast('Bônus diário já foi resgatado');return}state.coins+=500;state.dailyClaimed=new Date().toDateString();save();renderPage();toast('500 moedas de demonstração adicionadas')}
function boostPost(){if(state.coins<500){toast('Você precisa de 500 moedas');return}state.coins-=500;save();toast('Impulsionamento demonstrativo ativado por 30 min');renderPage()}
function copyReferral(){let url=location.href.split('?')[0]+'?ref='+encodeURIComponent(state.username);if(navigator.clipboard){navigator.clipboard.writeText(url).then(()=>toast('Link de convite copiado'))}else{prompt('Copie seu link de convite:',url)}}
function loginModal(){openModal(`<div class="modal-head"><h2>Entrar / criar conta</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Demonstração local, sem envio de dados.</p><div class="formrow"><label>E-mail ou usuário</label><input class="field" id="loginUser" placeholder="seu@email.com"></div><div class="formrow"><label>Senha</label><input class="field" id="loginPass" type="password" placeholder="••••••••"></div><button class="btn" onclick="closeModal();toast('Login real precisa de backend seguro')">Continuar (demo)</button><p class="small-text" style="margin-top:12px">Não use uma senha real neste protótipo.</p>`)}
init();
</script></body></html>
